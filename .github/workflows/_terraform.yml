name: Terraform

on:
    workflow_call:

permissions:
    id-token: write # nécessaire pour l'OIDC
    contents: read

concurrency: terraform # jamais deux runs en même temps (verrou du state)

jobs:
    terraform:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform/eb # Change le dossier par défaut pour executer les run !
        steps:
            - uses: actions/checkout@v4

            - uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "~1.10"

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: eu-west-3
                  role-to-assume: arn:aws:iam::911558392127:role/deploy

            - run: terraform init -input=false
            - run: terraform validate
            - run: terraform apply -input=false -auto-approve
