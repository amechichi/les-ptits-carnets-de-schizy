name: Destroy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Infra à détruire"
        type: choice
        options: [ecs, eb]
        required: true
      confirm:
        description: 'Tapez "destroy" pour confirmer la destruction'
        required: true

permissions:
  id-token: write
  contents: read

concurrency: terraform # partagé avec _terraform.yml

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: terraform/${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"

      -   uses: aws-actions/configure-aws-credentials@v6
          with:
              aws-region: eu-west-3
              role-to-assume: arn:aws:iam::911558392127:role/deploy

      - run: terraform init -input=false
      - run: terraform destroy -input=false -auto-approve
