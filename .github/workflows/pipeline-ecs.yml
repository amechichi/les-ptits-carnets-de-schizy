name: Pipeline ECS

# Build Docker -> Terraform (infra ECS) -> Mise à jour de l'image sur le service ECS
# Manuel, ou en créant un tag qui commence par "v" (ex: v1.0)
on:
    workflow_dispatch:
    push:
        tags: ["v*"]

permissions:
    id-token: write
    contents: read
    packages: write

jobs:
    docker:
        uses: ./.github/workflows/_docker.yml

    terraform:
        needs: docker
        uses: ./.github/workflows/_terraform.yml
        with:
            working-directory: terraform/ecs

    deploy:
        needs: terraform
        uses: ./.github/workflows/update-ecs.yml
