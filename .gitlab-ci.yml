stages:
    - debug
    - build
    - deploy

variables:
    AWS_REGION: eu-west-3
    ROLE_ARN: arn:aws:iam::911558392127:role/deploy-gitlab
    S3_BUCKET: elasticbeanstalk-eu-west-3-911558392127
    EB_APPLICATION: les-ptits-carnets-de-schizy
    EB_ENVIRONMENT: les-ptits-carnets-de-schizy-env-gitlab
    # Solution stack Elastic Beanstalk pour un nouvel environnement PHP.
    # Vérifie la valeur exacte dispo dans ta région avec :
    # aws elasticbeanstalk list-available-solution-stacks
    EB_SOLUTION_STACK: "64bit Amazon Linux 2023 v4.13.7 running PHP 8.5"
    # Rôles IAM requis par Elastic Beanstalk pour les instances EC2 et le service.
    # Vérifie qu'ils existent déjà dans ton compte (créés par défaut si tu as
    # déjà créé un environnement via la console) :
    #   aws iam get-instance-profile --instance-profile-name aws-elasticbeanstalk-ec2-role
    #   aws iam get-role --role-name aws-elasticbeanstalk-service-role
    EB_INSTANCE_PROFILE: aws-elasticbeanstalk-ec2-role
    EB_SERVICE_ROLE: aws-elasticbeanstalk-service-role

# Équivalent du job "run_job_with_aws" : affiche les claims du token OIDC
show_oidc_token_claims:
    stage: debug
    image: python:3.12-slim
    id_tokens:
        AWS_ID_TOKEN:
            aud: sts.amazonaws.com
    script:
        - echo "$AWS_ID_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | python3 -m json.tool
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'

# Équivalent des steps checkout / setup-php / composer install / zip
build:
    stage: build
    image: composer:2  # basé sur PHP 8.x + composer, ajustez la version si besoin de PHP 8.5 précis
    script:
        - composer install # --no-dev --optimize-autoloader --no-interaction
        # - Tests (à faire avant le --no-dev si besoin de PHPUnit)
        - apt-get update -y && apt-get install -y zip
        - zip -r app.zip . -x '.git/*' 'var/cache/*' 'var/log/*'
    artifacts:
        paths:
            - app.zip
        expire_in: 1 hour
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'

# Équivalent de configure-aws-credentials + déploiement Elastic Beanstalk
deploy:
    stage: deploy
    image:
        name: amazon/aws-cli:2.15.0
        entrypoint: [""]
    id_tokens:
        AWS_ID_TOKEN:
            aud: sts.amazonaws.com
    needs:
        - build
    before_script:
        # L'AWS CLI v2 sait nativement échanger un jeton web identity
        # contre des credentials temporaires via ces variables d'env.
        - echo "$AWS_ID_TOKEN" > /tmp/web_identity_token
        - export AWS_ROLE_ARN="$ROLE_ARN"
        - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web_identity_token
        - export AWS_DEFAULT_REGION="$AWS_REGION"
    script:
        - VERSION="$CI_COMMIT_SHA"
        - aws s3 cp app.zip "s3://${S3_BUCKET}/${VERSION}.zip"
        # Idempotence : si un retry de pipeline retombe sur le même commit,
        # la version existe déjà côté Elastic Beanstalk. On ne la recrée pas.
        - >
            EXISTING_VERSION=$(aws elasticbeanstalk describe-application-versions
            --application-name "$EB_APPLICATION"
            --version-labels "$VERSION"
            --query 'ApplicationVersions[0].VersionLabel'
            --output text)
        - |
            if [ "$EXISTING_VERSION" == "None" ] || [ -z "$EXISTING_VERSION" ]; then
              echo "Création de la version $VERSION..."
              aws elasticbeanstalk create-application-version \
                --application-name "$EB_APPLICATION" \
                --version-label "$VERSION" \
                --source-bundle S3Bucket="$S3_BUCKET",S3Key="${VERSION}.zip"
            else
              echo "La version $VERSION existe déjà, on saute la création."
            fi
        # Idempotence : create-environment échoue si l'environnement existe déjà.
        # On vérifie donc son statut avant de choisir create ou update.
        - >
            ENV_STATUS=$(aws elasticbeanstalk describe-environments
            --application-name "$EB_APPLICATION"
            --environment-names "$EB_ENVIRONMENT"
            --query 'Environments[0].Status'
            --output text)
        - |
            if [ "$ENV_STATUS" == "None" ] || [ -z "$ENV_STATUS" ] || [ "$ENV_STATUS" == "Terminated" ]; then
              echo "Création de l'environnement $EB_ENVIRONMENT..."
              aws elasticbeanstalk create-environment \
                --application-name "$EB_APPLICATION" \
                --environment-name "$EB_ENVIRONMENT" \
                --solution-stack-name "$EB_SOLUTION_STACK" \
                --version-label "$VERSION" \
                --option-settings \
                  Namespace=aws:autoscaling:launchconfiguration,OptionName=IamInstanceProfile,Value="$EB_INSTANCE_PROFILE" \
                  Namespace=aws:elasticbeanstalk:environment,OptionName=ServiceRole,Value="$EB_SERVICE_ROLE"
            else
              echo "L'environnement existe déjà (statut: $ENV_STATUS), mise à jour..."
              aws elasticbeanstalk update-environment \
                --environment-name "$EB_ENVIRONMENT" \
                --version-label "$VERSION"
            fi
    rules:
        - if: '$CI_COMMIT_BRANCH == "main"'
